name: Refactor baseline
on:
  push:
    branches: [codex/progress-io-refactor-20260921]
    paths: [.github/workflows/refactor-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Archive tracked source and pinned dependency wheels
        run: |
          mkdir -p baseline/wheels
          git archive --format=zip HEAD -o baseline/source.zip
          git rev-parse HEAD > baseline/commit.txt
          python -m pip download --only-binary=:all: -r requirements-dev.txt -d baseline/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-baseline
          path: baseline/
          retention-days: 3
          if-no-files-found: error
