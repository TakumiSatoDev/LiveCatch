name: Apply verified refactor
on:
  push:
    branches: [codex/progress-io-refactor-20260921]
    paths: [.github/workflows/refactor-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply locally tested files with before and after hashes
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          plans = []
          for packet in sorted(Path('.github').glob('refactor-edits-*.json')):
              plans.extend(json.loads(packet.read_text(encoding='utf-8')))
          assert len(plans) == 24, f'Unexpected file count: {len(plans)}'
          seen, prepared = set(), []
          for item in plans:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'livecatch_core', 'tests', 'scripts', 'benchmarks', 'docs', 'installer', 'README.md', 'CHANGELOG.md', 'build_release.bat'}
              assert str(path) not in seen
              seen.add(str(path))
              before = item['before_sha256']
              if before is None:
                  assert not path.exists(), f'Unexpected existing file: {path}'
                  original = b''
              else:
                  original = path.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == before, f'Before hash mismatch: {path}'
              lines = original.decode('utf-8').splitlines(keepends=True)
              last = 0
              for start, end, replacement in item['edits']:
                  assert type(start) is int and type(end) is int and last <= start <= end <= len(lines)
                  assert isinstance(replacement, str)
                  last = end
              for start, end, replacement in reversed(item['edits']):
                  lines[start:end] = [replacement]
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['after_sha256'], f'After hash mismatch: {path}'
              prepared.append((path, result))
          for path, content in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              print(f'Verified {path}')
          Path(os.environ['RUNNER_TEMP'], 'refactor-paths.json').write_text(json.dumps(sorted(seen)), encoding='utf-8')
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Compile and test real local HTTP and Tk paths
        run: |
          python -m compileall -q livecatch_core tests scripts
          xvfb-run -a python -m pytest -q
          xvfb-run -a python scripts/gui_smoke.py
          python benchmarks/telemetry_latency.py
      - name: Commit verified source to the refactor branch
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          paths = json.loads(Path(os.environ['RUNNER_TEMP'], 'refactor-paths.json').read_text(encoding='utf-8'))
          def git(*args):
              return subprocess.run(['git', *args], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', '--', *paths)
          git('commit', '-m', 'refactor: unify progress telemetry and repair recording feedback')
          git('push', 'origin', 'HEAD:refs/heads/codex/progress-io-refactor-20260921')
