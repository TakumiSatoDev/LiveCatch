name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          $declared = (python -c "from livecatch_core import __version__; print(__version__)").Trim()
          if ($declared -ne $version) {
            throw "Tag $version does not match livecatch_core version $declared."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build and test installer
        shell: pwsh
        run: .\scripts\build_release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiveCatch v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/installer/LiveCatch-Setup-${{ steps.version.outputs.version }}.exe
            dist/installer/LiveCatch-Update-${{ steps.version.outputs.version }}.zip
