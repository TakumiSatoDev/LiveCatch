name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "main"
    paths:
      - ".github/release-version.txt"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("v")) {
              throw "Release tag must start with v."
            }
            $version = $tag.Substring(1)
          } else {
            $version = (Get-Content ".github/release-version.txt" -Raw).Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          $declared = (python -c "from livecatch_core import __version__; print(__version__)").Trim()
          if ($declared -ne $version) {
            throw "Release version $version does not match livecatch_core version $declared."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build and test installer
        shell: pwsh
        run: .\scripts\build_release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LiveCatch v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/installer/LiveCatch-Setup-${{ steps.version.outputs.version }}.exe
            dist/installer/LiveCatch-Update-${{ steps.version.outputs.version }}.zip
